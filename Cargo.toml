[package]
name = "meeting-copilot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenvy = "0.15"
cpal = "0.15"
wasapi = "0.27"
webrtc-vad = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
futures = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
eframe = "0.31"
egui = "0.31"
whisper-rs = { version = "0.16.0", features = ["cuda"] }
png = "0.17"
global-hotkey = "0.6"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
